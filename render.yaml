services:
  - type: web
    name: madverse-review-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
    disk:
      name: madverse-sqlite-data
      mountPath: /opt/render/project/src/backend/db
      sizeGB: 1
